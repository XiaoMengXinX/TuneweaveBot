services:
  bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: "<api-id>"
      TELEGRAM_API_HASH: "<api-hash>"
    networks:
       - tuneweave

  bot:
    image: ghcr.io/xiaomengxinx/tuneweavebot:latest
    environment:
      TUNEWEAVE_DATABASE_PATH: /app/data/cache.db
    volumes:
      - ./config.toml:/app/config.toml
      - ./data:/app/data
      - ./cache:/app/cache
      - ./log:/app/log
    depends_on:
      bot-api:
        condition: service_started
    networks:
      - tuneweave

networks:
    tuneweave:
