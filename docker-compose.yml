services:
  bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: "<api-id>"
      TELEGRAM_API_HASH: "<api-hash>"
    networks:
       - tuneweave

  bot:
    image: ghcr.io/xiaomengxinx/tuneweavebot:latest
    environment:
      TUNEWEAVE_DATABASE_PATH: /app/data/cache.db
      # 面板在容器内对外监听，只映射到宿主机本机，由 tunnel 或反向代理转发
      TUNEWEAVE_WEBAPP_LISTEN: 0.0.0.0:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.toml:/app/config.toml
      - ./data:/app/data
      - ./cache:/app/cache
      - ./log:/app/log
      - ./plugins:/app/plugins
    depends_on:
      bot-api:
        condition: service_started
    networks:
      - tuneweave

networks:
    tuneweave:
