# TuneweaveBot 配置示例
# 所有配置项都可用环境变量覆盖，如 TUNEWEAVE_BOT_TOKEN、TUNEWEAVE_DOWNLOAD_TIMEOUT
# 也可用 ./TuneweaveBot gen-config 按已装插件生成带注释的配置模板

[bot]
token = "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZ" # 必填，BotFather 给的 token
api_url = "https://api.telegram.org"          # 自建 Bot API 时修改
local_mode = false                           # API 开启 --local 且 bot 可读取其文件目录时启用
upload_timeout = "120s"                      # 上传及其他 Telegram API 请求的总超时，须为正时长
admin = [115414, 1919810]                     # 管理员用户 ID，可用 /rmcache /reload
cache_chat = 0                                # 缓存群 ID，Guest Mode 点歌时先把未缓存的歌曲上传到这里；0 为关闭，可用 /setcachechat 设置
debug = false                                 # 在终端输出 SDK 调试日志，[log] level 为 debug 时同时写入日志文件

[plugins]
dir = "./plugins"                # .wasm 插件目录，构建后由 build-plugins.sh 复制到这里
enabled = []                     # 要加载的插件名（文件名去掉 .wasm）；留空 = 加载目录下全部
default = "netease"              # 默认 provider，/music、/search、/login 未指定时使用
instances = 1                    # 每个插件的实例池大小；识曲等耗时插件可适当增加
call_timeout = "30s"             # 单次插件调用超时
memory_mb = 128                  # 单个插件实例内存上限
http_max_bytes = 8388608         # 插件单次 HTTP 响应大小上限
allow_private_networks = false   # 是否允许插件访问/下载私网地址（默认拒绝，防止 SSRF）
proxy = ""                       # 所有插件 HTTP 及宿主下载共用的代理，留空保留环境代理
# proxy 支持 http://host[:port]、https://host[:port]、socks5://host[:port]、socks5h://host[:port]
# 可选认证，如 http://user:password@127.0.0.1:8080 或 socks5://127.0.0.1:1080；不允许路径、query、fragment

# 每个插件一个独立配置段 [plugins.<插件名>]，整段原样传给该插件，宿主不解释其内容。
[plugins.netease]
music_u = "你的 MUSIC_U cookie" # 可留空：留空或失效时用管理员命令 /login 扫码或 /login netease token 提交 cookie 登录
level = "hires"                  # 优先音质: standard/higher/lossless/hires/jyeffect(高清环绕声)/sky(沉浸环绕声)/jymaster(超清母带)，账号无权限时自动降级
# 环境变量覆盖：TUNEWEAVE_PLUGINS_CONFIG_NETEASE_LEVEL=lossless

[database]
path = "cache.db" # SQLite 数据库路径

[download]
timeout = "120s"       # 单次下载请求超时
retries = 3           # 下载失败后的重试次数
concurrency = 4       # 同时下载任务数

[log]
level = "info" # trace/debug/info/warn/error
path = "./log" # 日志目录，按日期切分
